[project]
name = "gateway-standalone"
version = "0"  # never published; the image is versioned by its git tag
description = "DatRail Gateway's standalone FastMCP/Starlette host."
requires-python = ">=3.12"
# Packages imported directly are listed, even those fastmcp already brings.
dependencies = [
    "gateway-core",
    "fastmcp==3.4.6",
    # [standard] brings uvloop and httptools: the event loop and HTTP parser the image runs.
    "uvicorn[standard]==0.52.1",
    "starlette==1.4.1",
    "httpx==0.28.1",
    # Same version as DatRail Proxy: both parse the same routes file.
    "pyyaml==6.0.1",
]

[tool.uv.sources]
gateway-core = { workspace = true }

[build-system]
requires = ["uv_build==0.12.21"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "gateway.standalone"
