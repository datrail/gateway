# The Apigee callout's e2e stack: the callout behind a stand-in for an Apigee
# proxy running the reference bundle (apigee_standin.py, a model of Apigee),
# and the image's own checks.
#
#   make e2e-apigee-grpc   # the result is the driver's exit code
#   make e2e-down

name: datrail-gateway-e2e-apigee-grpc

x-callout: &callout
  build:
    context: ../..
    dockerfile: gateway-apigee-grpc/Dockerfile
  healthcheck:
    # Liveness, on RAIL_GATEWAY_PORT.
    test: ["CMD", "python", "-m", "gateway.apigee_grpc.probe_health"]
    interval: 2s
    timeout: 3s
    retries: 15

services:
  rail-center:
    extends: {file: ../shared/services.yml, service: rail-center}

  upstream:
    extends: {file: ../shared/services.yml, service: upstream}

  callout:
    <<: *callout
    environment:
      RAIL_CENTER_URL: http://rail-center:8080
      RAIL_GATEWAY_SLUG: edge
      RAIL_PLUGIN_ENABLED: "true"
      RAIL_AUTH_MODE: bearer
      # Selects the enforce bundle from the stub.
      RAIL_AUTH_TOKEN: e2e-enforce
      RAIL_GATEWAY_BUNDLE_REFRESH_SECONDS: "3600"
    depends_on:
      rail-center: {condition: service_healthy}

  # Enrolled, on a non-default port, with a Rail Center it can't reach: it must
  # still start, and serve on the port it was given.
  callout-unreachable:
    <<: *callout
    environment:
      RAIL_CENTER_URL: http://rail-center.invalid
      RAIL_GATEWAY_SLUG: edge
      RAIL_PLUGIN_ENABLED: "true"
      RAIL_GATEWAY_PORT: "9100"

  # Two proxies, as on the live harness: /mcp judged by the callout, and
  # /no-callout, whose callout never resolves. The callout's image has grpc
  # and the generated code.
  apigee:
    <<: *callout
    environment:
      APIGEE_PROXIES: /mcp=callout:8080,/no-callout=no-callout.invalid:8080
      APIGEE_TARGET_URL: http://upstream:8080/mcp
      APIGEE_TIMEOUT_MS: "5000"
      APIGEE_BUNDLE: /e2e/apiproxy
    volumes:
      - ./apigee_standin.py:/e2e/apigee_standin.py:ro
      - ../../gateway-apigee-grpc/apigee/apiproxy:/e2e/apiproxy:ro
    command: ["python", "-u", "/e2e/apigee_standin.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8080))"]
      interval: 2s
      timeout: 3s
      retries: 15
    depends_on:
      callout: {condition: service_healthy}
      upstream: {condition: service_healthy}

  # The callout's own image: it has grpc and the generated code, and runs as
  # the image's user.
  driver:
    <<: *callout
    volumes:
      - ./driver.py:/e2e/driver.py:ro
      - ../shared/lib.py:/e2e/lib.py:ro
    # Unbuffered, so each line shows as it is reached.
    command: ["python", "-u", "/e2e/driver.py"]
    healthcheck: {disable: true}
    env_file: ../shared/tickets.env
    depends_on:
      callout: {condition: service_healthy}
      callout-unreachable: {condition: service_healthy}
      apigee: {condition: service_healthy}
