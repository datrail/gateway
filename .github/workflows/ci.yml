# Lint and test on every change, so a break surfaces on the pull request rather
# than after a release tag exists.
#
# container-release.yml calls this workflow and gates publishing on it. A tag
# can sit on any commit — including one that never went through a pull request
# — so the release path re-runs these checks rather than trusting that they ran
# earlier.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: >-
          Commit-ish to check out. A called workflow's `github.ref` is the
          caller's, which on workflow_dispatch is the branch the run was
          launched from rather than the tag being published — so the release
          path passes the resolved tag explicitly. Empty means "whatever
          triggered this run", which is right for pull_request and push.
        type: string
        required: false
        default: ""

permissions:
  contents: read

# Two pinning regimes, deliberately. Python packages are pinned exactly, because
# they are what the image ships and what a bug report is written against. The
# actions below are pinned to a major tag, which floats: they build nothing that
# is released, and a workflow that cannot pick up a runner-compatibility fix
# without a commit is a workflow that breaks on GitHub's schedule rather than
# this repository's. The trade is `contents: read` above, plus the actions cache
# these jobs necessarily reach — and that one is not bounded by the ref: cache
# writes are per-ref, but a run restores from its own branch *and* the default
# branch, so anything written here on main is reachable from every later pull
# request. Nothing secret goes there, and nothing here closes it: pip reuses a
# cached wheel under its pinned version without checking it, so the exact pins
# two files over do not help, and requirements.txt says itself that most of what
# lands in that cache is unpinned anyway. Closing it wants hashes.

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # requirements-dev.txt pins ruff exactly, so this runs the same tool at
      # the same version a contributor runs locally.
      - run: pip install -r requirements-dev.txt

      # `ruff check` plus `ruff format --check`, per the Makefile.
      - run: make lint

  # Bounded because the default is six hours, and a stuck job holds a runner for
  # an afternoon. Ten minutes rather than one: `pytest.ini` already fails an
  # individual test at thirty seconds, so this is the ceiling on everything
  # around the suite — checkout, the interpreter, a cold pip cache — none of
  # which the suite's own five seconds predicts.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # The interpreter the image ships (see the Dockerfile). There is no
      # .python-version to read from, so if the Dockerfile moves, move this with
      # it — otherwise the suite passes on a Python the image never runs.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # Both files, because requirements-test.txt only `-r`s the other one:
          # keyed on the including file alone, a runtime pin could move and the
          # cache would not rotate.
          cache-dependency-path: |
            requirements-test.txt
            requirements.txt

      # requirements-test.txt includes requirements.txt, so the suite runs
      # against the exact pins the image installs.
      - run: pip install -r requirements-test.txt

      # Unbuffered and verbose. `-q` to a pipe is block-buffered, so a run that
      # hangs prints nothing at all and the log cannot say which test it
      # stopped in — which is exactly what happened, for fifty-four minutes.
      - run: make test
        env:
          PYTHONUNBUFFERED: "1"
          # -vv, not -v. Verbosity is additive and ADDOPTS is prepended, so
          # -v against the Makefile's -q nets zero and prints dots, which is
          # the state this was meant to fix.
          PYTEST_ADDOPTS: "-vv"


  # Build-only, amd64 only. The question here is "does the image still build",
  # which the arm64 leg answers no differently — it would just spend minutes
  # doing it under emulation. Without this job the Dockerfile is first built by
  # container-release.yml, on a tag, after the gate has already passed.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: docker/setup-buildx-action@v3

      # The scope the release build reads from. A literal name rather than
      # `github.workflow`: when called from container-release.yml it resolves
      # to the caller's name and would match, but this workflow also runs
      # directly on main, where it resolves to `CI` — so those warm caches would
      # never be visible to a release.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: gateway:ci
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image

      # `docker build` exiting 0 proves the image assembles, not that it runs:
      # a CMD naming a module that does not exist builds cleanly and fails on
      # start. This is the cheapest thing that tells the two apart.
      - name: The image starts and serves liveness
        run: |
          set -euo pipefail
          # A non-default port on purpose. With 8080 this step passes against
          # an image that validates RAIL_GATEWAY_PORT and then listens
          # somewhere else, which is the defect it exists to catch.
          docker run -d --name gw -p 9100:9100 \
            -e RAIL_GATEWAY_PORT=9100 \
            -e RAIL_GATEWAY_UPSTREAM_URL=http://upstream.invalid/mcp gateway:ci
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:9100/health >/dev/null; then
              echo "liveness ok"; docker rm -f gw >/dev/null; exit 0
            fi
            sleep 1
          done
          echo "::error::the image did not serve /health within 20s"
          docker logs gw
          docker rm -f gw >/dev/null
          exit 1
