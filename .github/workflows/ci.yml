# Lint, test, and check the image on every change. container-release.yml calls
# this workflow as its gate too: a tag can sit on a commit no pull request ran.

name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:
    inputs:
      ref:
        description: >-
          Commit to check out. The release passes its tag: a called workflow's
          own ref is the caller's, not the tag. Empty means the triggering commit.
        type: string
        required: false
        default: ""

permissions:
  contents: read

# Python packages and uv are pinned exactly: they are what the image ships.
# Actions float on a major tag, so runner fixes arrive without a commit, except
# setup-uv, which since v8 publishes only exact tags.

# Every uv command fails if uv.lock does not match the pyproject.toml files.
env:
  UV_LOCKED: "1"

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # The uv the Dockerfile uses. It installs Python from `.python-version`,
      # and caches its downloads and that Python between runs.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          cache-python: true

      - run: make init
      - run: make lint

  test:
    runs-on: ubuntu-26.04
    # Each test already times out at 30s; this bounds everything around them.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          cache-python: true

      - run: make init

      # Unbuffered, and one line per test, so a hang shows which test it is in.
      # `-vv` because ADDOPTS is prepended: `-v` would cancel the Makefile's `-q`.
      - run: make test
        env:
          PYTHONUNBUFFERED: "1"
          PYTEST_ADDOPTS: "-vv"

  # amd64 only: the release builds arm64 as well, and emulating it here would
  # answer "does it build" no differently.
  image:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: docker/setup-buildx-action@v4

      # Context is the repo root, for uv.lock; Dockerfile.dockerignore limits
      # what is sent. The cache scope is shared with container-release.yml, so a
      # release reuses these layers: keep the two names in step.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: gateway-standalone/Dockerfile
          push: false
          load: true
          tags: gateway:ci
          cache-from: type=gha,scope=image-standalone
          cache-to: type=gha,mode=max,scope=image-standalone

      # A build can succeed and the image still fail to start. Run it with every
      # variable `.env.example` requires, on a non-default port (to catch
      # RAIL_GATEWAY_PORT being ignored), and with a control plane it cannot
      # reach: it must still come up live and report itself unready.
      - name: The image starts, serves liveness, and reports itself unready
        run: |
          docker run -d --name gw -p 9100:9100 \
            -e RAIL_GATEWAY_PORT=9100 \
            -e RAIL_PLUGIN_ENABLED=true \
            -e RAIL_CENTER_URL=http://rail-center.invalid \
            -e RAIL_GATEWAY_SLUG=edge \
            -e RAIL_GATEWAY_ROUTES_FILE=/etc/rail/routes.yaml \
            -v "$PWD/e2e/routes.yaml:/etc/rail/routes.yaml:ro" gateway:ci

          # Startup waits up to 5s for a first bundle fetch; 40 tries is margin.
          curl -fsS -o /dev/null --retry 40 --retry-delay 1 --retry-all-errors \
            http://127.0.0.1:9100/health \
            || { echo "::error::the image did not serve /health"; exit 1; }

          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9100/ready)
          if [ "$code" != 503 ]; then
            echo "::error::/ready answered $code holding no bundle, expected 503"
            exit 1
          fi

      - name: Logs, on failure
        if: failure()
        run: docker logs gw

  # The only check of a decision over the wire: a policy fetched from a control
  # plane refusing a real MCP call, and the denial reaching it.
  e2e:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: docker/setup-buildx-action@v4

      # The exact command the READMEs document. `--exit-code-from driver` makes
      # the driver's assertions the result.
      - name: A policy refuses a real call, and the denial is reported
        run: |
          docker compose -f e2e/compose.yml up --build --force-recreate \
            --abort-on-container-exit --exit-code-from driver

      # The driver says which assertion failed; the logs say why.
      - name: Logs, on failure
        if: failure()
        run: docker compose -f e2e/compose.yml logs --no-color
