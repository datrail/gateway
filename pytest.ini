[pytest]
# Strict mode: pytest-asyncio runs an async test only when it carries the
# marker. One that forgets is not claimed by the plugin and pytest fails it as
# unsupported — checked, not assumed — so a test cannot be counted as passing
# without having run.
asyncio_mode = strict
testpaths = tests
# Without this only `python -m pytest` collects, because that form alone puts
# the working directory on sys.path — bare `pytest`, and every IDE runner that
# uses it, fails at conftest import rather than on a test.
pythonpath = .
